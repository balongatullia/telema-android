name: Build APK Android - Telema

# Se declenche automatiquement a chaque envoi (push) sur la branche principale,
# et peut aussi etre lance manuellement depuis l'onglet "Actions" de GitHub.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Forcer 'python' a utiliser la version 3.11 partout
        run: |
          sudo ln -sf "$(which python3.11)" /usr/bin/python
          sudo ln -sf "$(which python3.11)" /usr/local/bin/python
          python --version

      - name: Neutraliser toute version de Python plus recente presente sur l'image
        run: |
          for v in python3.12 python3.13 python3.14 python3.15; do
            p=$(command -v "$v" 2>/dev/null || true)
            if [ -n "$p" ]; then
              echo "Neutralisation de $p ($v)"
              sudo mv "$p" "${p}.disabled" 2>/dev/null || true
            fi
          done
          echo "--- interpretes restants ---"
          for v in python python3 python3.11 python3.12 python3.13 python3.14; do
            command -v "$v" 2>/dev/null && "$v" --version 2>/dev/null || true
          done

      - name: Installer les dependances systeme necessaires a Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential

      - name: Fixer JAVA_HOME sur Java 17 (obligatoire pour le plugin Gradle Android)
        run: |
          JAVA17_JAVAC=$(update-alternatives --list javac | grep -i '\-17' | head -1)
          if [ -z "$JAVA17_JAVAC" ]; then
            JAVA17_JAVAC=$(find /usr/lib/jvm -maxdepth 1 -iname '*17*' -exec find {} -name javac \; | head -1)
          fi
          JAVA17_HOME=$(dirname "$(dirname "$JAVA17_JAVAC")")
          echo "Java 17 trouve dans : $JAVA17_HOME"
          echo "JAVA_HOME=$JAVA17_HOME" >> "$GITHUB_ENV"
          echo "$JAVA17_HOME/bin" >> "$GITHUB_PATH"

      - name: Installer Buildozer et Cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Compiler l'APK (telechargement automatique du SDK/NDK Android)
        id: build_step
        continue-on-error: true
        run: |
          set -o pipefail
          yes | buildozer android debug 2>&1 | tee /tmp/build_output.log

      - name: Sauver le journal d'erreur dans le depot (si echec)
        if: steps.build_step.outcome == 'failure'
        run: |
          tail -n 500 /tmp/build_output.log > build_error_log.txt
          git config user.email "bot@telema.local"
          git config user.name "Telema Build Bot"
          git add build_error_log.txt
          git commit -m "Journal d'erreur de compilation [skip ci]" || true
          git push

      - name: Marquer l'etape comme echouee si besoin
        if: steps.build_step.outcome == 'failure'
        run: exit 1

      - name: Publier l'APK genere
        uses: actions/upload-artifact@v4
        with:
          name: TelemaGestion-APK
          path: bin/*.apk
