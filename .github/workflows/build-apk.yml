name: Build APK Android - Telema

# Se declenche automatiquement a chaque envoi (push) sur la branche principale,
# et peut aussi etre lance manuellement depuis l'onglet "Actions" de GitHub.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances systeme necessaires a Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential

      - name: Installer Buildozer et Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Compiler l'APK (telechargement automatique du SDK/NDK Android)
        run: |
          yes | buildozer android debug

      - name: Publier l'APK genere
        uses: actions/upload-artifact@v4
        with:
          name: TelemaGestion-APK
          path: bin/*.apk
